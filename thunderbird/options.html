<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px system-ui, sans-serif; margin: 16px; max-width: 520px; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    p { color: #555; margin: 6px 0 12px; }
    button { font: inherit; padding: 6px 14px; }
    label { display: block; padding: 4px 0; }
    #status { margin: 8px 0; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Tetra Mail</h1>
  <p>Λογαριασμοί που ανοίγει μόνο το Thunderbird (π.χ. του πανεπιστημίου) φτάνουν και στο Tetra: Εισερχόμενα και Απεσταλμένα. Ό,τι στέλνεις από αυτούς στο Tetra, το στέλνει το Thunderbird.</p>
  <div id="status"></div>
  <button id="pair">Σύνδεση με το Tetra</button>
  <div id="accounts"></div>
  <script src="options.js"></script>
</body>
</html>
